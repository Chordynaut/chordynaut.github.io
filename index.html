<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Chordynaut">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Chordynaut - Solana Chord Synthesizer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cosmic: {
                            bg: '#0a0a0f',
                            panel: '#1a1a2e',
                            accent: '#16213e',
                            highlight: '#0f3460',
                            glow: '#00ffa3',
                            secondary: '#dc1fff',
                            tertiary: '#14f195'
                        }
                    }
                }
            }
        }
    </script>
    <script>
        // Defensive JS patch: disable iOS long-press actions globally
        const preventNativeLongPress = (e) => e.preventDefault();
        document.addEventListener('gesturestart', preventNativeLongPress, { capture: true });
        document.addEventListener('selectstart', preventNativeLongPress, { capture: true });
        document.addEventListener('contextmenu', preventNativeLongPress, { capture: true });
        document.addEventListener('dragstart', preventNativeLongPress, { capture: true });
        document.addEventListener('selectionchange', function() {
            const selection = window.getSelection && window.getSelection();
            if (selection && selection.rangeCount) selection.removeAllRanges();
        });

        // Centralized layout recomputation function
        function recomputeLayout() {
            const viewport = window.visualViewport;
            const height = viewport ? viewport.height : window.innerHeight;
            const width = viewport ? viewport.width : window.innerWidth;

            document.documentElement.style.setProperty('--app-height', `${height}px`);
            document.documentElement.style.setProperty('--app-width', `${width}px`);
        }

        // Call recomputeLayout on various events
        window.addEventListener('load', () => {
            requestAnimationFrame(recomputeLayout);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', recomputeLayout);
        } else {
            window.addEventListener('resize', recomputeLayout);
        }

        window.addEventListener('orientationchange', () => {
            setTimeout(recomputeLayout, 100);
        });

        if (document.fonts) {
            document.fonts.ready.then(recomputeLayout);
        }

        // Export for use after overlay toggles
        window.recomputeLayout = recomputeLayout;
    </script>
</head>
<body oncontextmenu="return false;" spellcheck="false" autocorrect="off" class="bg-cosmic-bg text-white overflow-hidden">
    <div class="neon-bar"></div>
    <div id="orientation-lock" class="fixed inset-0 bg-cosmic-bg z-50 flex flex-col items-center justify-center p-8 text-center">
        <div class="solana-lock-logo" role="img" aria-label="Solana logo">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="text-6xl mb-6">Mobile landscape required</div>
        <h2 class="text-2xl font-bold mb-4">Please Rotate Your Device</h2>
        <p class="text-gray-400">Chordynaut requires landscape orientation for the best experience</p>
    </div>
    <div id="root" class="hidden"></div>
    <script src="app.js"></script>
</body>
</html>
